<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>My Library</h1>
    <p>Welcome to my library!</p>
    {% if not books %}
      <p>No books in the library yet.</p>
    {%endif %}
    {% for book in books %}
      <ul>
        <li>{{ book.title }} by {{ book.author }} - Rating: {{ book.ratings }}</li>
      </ul>
    
    {% endfor %}
    
    <a href="{{ url_for('add') }}">Add New Book</a>
  </body>
</html>
